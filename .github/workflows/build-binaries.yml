name: Build binaries

on:
  workflow_call:
    inputs:
      version:
        description: "Release package version; empty keeps the checked-out version."
        type: string
        required: false
        default: ""

# Token permissions are supplied by the caller: PRs read packages; main/releases write.
jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            binary: decay-x64
            machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            binary: decay-arm64
            machine: AArch64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: linux-buildcache-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Keep caches in the existing public package so fork PRs can restore anonymously.
      CACHE_REF: ghcr.io/brunojppb/turbo-cache-server:buildcache-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/set-version.py "$RELEASE_VERSION"

      - uses: docker/setup-buildx-action@v4
      - name: Authenticate trusted cache writer
        id: registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read pinned Rust version
        id: rust
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"

      - name: Compile and export executable
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          platforms: linux/${{ matrix.arch }}
          build-args: RUST_VERSION=${{ steps.rust.outputs.version }}
          outputs: type=local,dest=out
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ steps.registry.outcome == 'success' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

      - name: Verify static binary and package runtime
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
        run: |
          chmod +x out/decay
          readelf -h out/decay | grep -F "$MACHINE"
          if readelf -l out/decay | grep -q INTERP; then
            echo 'Expected a statically linked musl executable'
            exit 1
          fi
          mkdir -p "image/linux/$ARCH"
          cp out/decay "image/linux/$ARCH/decay"
          docker build --platform "linux/$ARCH" -f Dockerfile.release -t decay-smoke image
          .github/scripts/smoke-image.sh decay-smoke out/decay

      - name: Name action binary
        env:
          BINARY: ${{ matrix.binary }}
        run: mv out/decay "out/$BINARY"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-binaries
          path: out/${{ matrix.binary }}
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/set-version.py "$RELEASE_VERSION"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          target: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Apple Silicon executable
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --bin decay
          mkdir -p out
          cp target/aarch64-apple-darwin/release/decay out/decay-darwin-arm64
          test "$(lipo -archs out/decay-darwin-arm64)" = arm64
      - uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: out/decay-darwin-arm64
          if-no-files-found: error
