name: "Live S3 tests"

# Manual only: the job needs a running object store and takes minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      rustfs:
        image: rustfs/rustfs:1.0.0
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Wait for RustFS
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:9000/; then
              echo "RustFS answered after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not answer on http://127.0.0.1:9000 within 60s"
          exit 1

      - name: Run the live tests
        run: cargo live-test
        env:
          # The trailing slash is on purpose: the run exercises the endpoint
          # normalization the server does at startup.
          S3_ENDPOINT: http://127.0.0.1:9000/
          S3_ACCESS_KEY: rustfsadmin
          S3_SECRET_KEY: rustfsadmin
          S3_BUCKET_NAME: turbo-live
          S3_REGION: us-east-1
          S3_USE_PATH_STYLE: "true"
          OTEL_SDK_DISABLED: "true"
          TEST_LOG: "1"
