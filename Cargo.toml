[package]
name = "decay"
edition = "2024"
rust-version = "1.100.0"
version = "0.0.0"
authors = ["Bruno Paulino <hi@bpaulino.com>"]
license = "MIT"
repository = "https://github.com/brunojppb/turbo-cache-server"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "decay"

[dependencies]
actix-web = "4"
dotenv = "0.15.0"
rust-s3 = { version = "0.38", default-features = false, features = [
  "fail-on-err",
  "tokio-rustls-tls-ring",
] }
# Also trusts the system CA store, so S3 endpoints behind a private CA keep working.
reqwest-native-roots = { package = "reqwest", version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = { version = "0.1", features = ["log"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tracing-opentelemetry = "0.34"
futures = "0.3"
http = "1"
opentelemetry = { version = "0.33" }
opentelemetry_sdk = { version = "0.33", features = [
  "rt-tokio",
  "experimental_trace_batch_span_processor_with_async_runtime",
  "experimental_metrics_periodicreader_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
opentelemetry-semantic-conventions = { version = "0.33.0", features = [
  "semconv_experimental",
] }
sysinfo = "0.40"
tonic = "0.14.2"
secrecy = "0.10.3"
tracing-actix-web = "0.7"
subtle = "2"

[dev-dependencies]
pretty_assertions = "1.4.1"
reqwest = "0.13"
wiremock = "0.6"


[profile.release]
# For more details on smaller binary size, see:
# https://github.com/johnthagen/min-sized-rust/blob/094d314f0c28f7e4bffeb0b0258f71cb303bd91a/README.md
strip = true    # Automatically strip symbols from the binary to reduce binary size
opt-level = 3   # Faster SigV4 payload hashing; rustls keeps the binary small.
lto = true

[lints.cargo]
unused_dependencies = "deny"
