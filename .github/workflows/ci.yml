name: "CI Checks"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  packaging-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test action/util.test.mjs
      - run: python3 .github/scripts/test-set-version.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain (channel + rustfmt/clippy) is pinned via rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2

      - name: Run Clippy
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo clippy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo test --all-features
        env:
          S3_ACCESS_KEY: some-access-key
          S3_SECRET_KEY: some-secret-key
          S3_REGION: eu-central-1
          S3_BUCKET_NAME: turbo
          S3_ENDPOINT: "http://localhost:9000"
