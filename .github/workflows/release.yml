name: Release new tag
on:
  workflow_dispatch:
    inputs:
      semver:
        description: "The SemVer value used by this release"
        type: string
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sanity-check:
    name: Branch sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.semver }}
        run: python3 .github/scripts/set-version.py "$RELEASE_VERSION"
      - name: Verify main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases should only run from the main branch"
          exit 1

  build:
    needs: [sanity-check]
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.event.inputs.semver }}

  release:
    name: Release Turbo Cache Server
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage release version
        env:
          RELEASE_VERSION: ${{ inputs.semver }}
        run: python3 .github/scripts/set-version.py "$RELEASE_VERSION"

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: action
          pattern: "*-binaries"
          merge-multiple: true

      - name: Make binaries executable
        run: |
          chmod +x action/decay-arm64
          chmod +x action/decay-x64
          chmod +x action/decay-darwin-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: login to Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Linux image context
        run: |
          mkdir -p release-image/linux/{amd64,arm64}
          cp action/decay-x64 release-image/linux/amd64/decay
          cp action/decay-arm64 release-image/linux/arm64/decay

      - name: Package and push Docker image (no compilation)
        uses: docker/build-push-action@v7
        with:
          context: release-image
          file: Dockerfile.release
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/brunojppb/turbo-cache-server:${{ inputs.semver }}
            ghcr.io/brunojppb/turbo-cache-server:latest

      - name: Commit new binary
        env:
          CACHE_SERVER_VERSION: ${{ github.event.inputs.semver }}
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add action/decay-arm64
          git add action/decay-x64
          git add action/decay-darwin-arm64 Cargo.toml Cargo.lock
          # Older release tags may contain the universal executable.
          git rm --ignore-unmatch action/decay-darwin-universal
          git commit -am "Release ${CACHE_SERVER_VERSION}"
          git tag -a "${CACHE_SERVER_VERSION}" -m "Release ${CACHE_SERVER_VERSION}"

      - name: Push new tag
        env:
          CACHE_SERVER_VERSION: ${{ github.event.inputs.semver }}
        run: git push origin "${CACHE_SERVER_VERSION}"

      - name: Stage release binaries
        run: |
          mkdir -p release-assets
          cp action/decay-x64 release-assets/decay-x86_64-unknown-linux-musl
          cp action/decay-arm64 release-assets/decay-aarch64-unknown-linux-musl
          cp action/decay-darwin-arm64 release-assets/decay-aarch64-apple-darwin
          chmod +x release-assets/*
          cd release-assets && sha256sum decay-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          CACHE_SERVER_VERSION: ${{ github.event.inputs.semver }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')

          NOTES_FILE=$(mktemp)
          echo "## What's Changed" > "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${CACHE_SERVER_VERSION}" \
              --pretty=format:"* %s (%h)" \
              --grep="^Release " --invert-grep >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CACHE_SERVER_VERSION}" >> "$NOTES_FILE"
          else
            git log "${CACHE_SERVER_VERSION}" \
              --pretty=format:"* %s (%h)" >> "$NOTES_FILE"
          fi

          echo "" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "## Downloads" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "Prebuilt binaries for running \`decay\` without Docker (e.g. as a systemd service)." >> "$NOTES_FILE"
          echo "The Linux binaries are statically linked (musl) and run on any modern x86-64/ARM64 Linux distro." >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "| Platform | Architecture | Asset |" >> "$NOTES_FILE"
          echo "| --- | --- | --- |" >> "$NOTES_FILE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${CACHE_SERVER_VERSION}"
          echo "| Linux (musl) | x86-64 | [decay-x86_64-unknown-linux-musl](${DOWNLOAD_URL}/decay-x86_64-unknown-linux-musl) |" >> "$NOTES_FILE"
          echo "| Linux (musl) | ARM64 | [decay-aarch64-unknown-linux-musl](${DOWNLOAD_URL}/decay-aarch64-unknown-linux-musl) |" >> "$NOTES_FILE"
          echo "| macOS | Apple Silicon (ARM64) | [decay-aarch64-apple-darwin](${DOWNLOAD_URL}/decay-aarch64-apple-darwin) |" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "Verify a download against \`SHA256SUMS\`, e.g. \`sha256sum -c SHA256SUMS --ignore-missing\`." >> "$NOTES_FILE"

          gh release create "${CACHE_SERVER_VERSION}" \
            --title "${CACHE_SERVER_VERSION}" \
            --notes-file "$NOTES_FILE" \
            release-assets/decay-x86_64-unknown-linux-musl \
            release-assets/decay-aarch64-unknown-linux-musl \
            release-assets/decay-aarch64-apple-darwin \
            release-assets/SHA256SUMS

          rm -f "$NOTES_FILE"
