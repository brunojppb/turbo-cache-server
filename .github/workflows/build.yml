name: Build binary
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml

  collect:
    name: Collect binaries
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: '*-binaries'
          merge-multiple: true

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: out/
